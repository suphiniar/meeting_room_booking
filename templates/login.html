<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        body {
            background:#1e1e2e;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
        }
        .box{
            background:#27293d;
            padding:32px;
            border-radius:16px;
            width:360px;
        }
        h2{
            margin-bottom:24px;
            text-align:center;
        }
        .item{
            margin-bottom:18px;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#cfcfcf;
        }
        input{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:none;
            background:#373952;
            color:#fff;
            font-size:16px;
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4285f4;
            color:#fff;
            font-size:16px;
            cursor:pointer;
        }
        .tip{
            margin-top:16px;
            text-align:center;
        }
        .tip a{
            color:#74b9ff;
            text-decoration:none;
        }
        .flash{
            color:#ff8888;
            margin-bottom:16px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>会议室预约系统 - 登录</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}
                        <p>{{msg}}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="item">
                <label>用户名</label>
                <input name="username" required>
            </div>
            <div class="item">
                <label>密码</label>
                <input name="password" type="password" required>
            </div>
            <button type="submit">登录</button>
        </form>
        <div class="tip">
            没有账号？<a href="{{url_for('register')}}">去注册</a>
            <p style="margin-top:10px; color:#aaa; font-size:14px;">忘记密码？请联系系统管理员重置密码</p>
        </div>
    </div>
</body>
</html>
